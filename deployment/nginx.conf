# Place in /etc/nginx/conf.d/parking-four.conf after copying dist/.
# Change the root directory and listen port to match the server.
server {
    listen 8080;
    server_name _;

    root /opt/parking-four-linux-v2/dist;
    index index.html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    autoindex off;

    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
